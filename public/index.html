<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>Plus Logistics - تتبع الطلب</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">+</span><span class="bname">Plus Logistics</span></div>
  <button id="lang" class="langbtn" type="button" aria-label="Language">EN</button>
</header>
<main>
  <section class="hero">
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
    <form id="form" autocomplete="off">
      <div class="field">
        <input id="awb" inputmode="latin" enterkeyhint="search" autocapitalize="characters" spellcheck="false" maxlength="30">
        <button type="submit" id="go"></button>
      </div>
    </form>
    <div id="chips" class="chips"></div>
  </section>
  <section id="result" aria-live="polite"></section>
  <section id="recent" class="recent"></section>
</main>
<footer id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
